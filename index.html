<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Symulator skrzynek</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <a href="#" id="nav-cases" class="active">Skrzynki</a>
      <a href="#">Upgrader</a>
      <a href="#">Case Battle</a>
      <a href="#">Exchanger</a>
    </div>

    <div class="nav-right">
      <button id="steam-login" class="login-btn">Zaloguj przez Steam</button>
      <div class="balance" id="balance" style="display:none;">0,00 zł</div>
      <div class="avatar" id="avatar" style="display:none;"></div>
      <div class="settings" id="settings" style="display:none;"></div>
    </div>
  </nav>

  <section class="cases">
    <h2>Regular Cases</h2>
    <div class="case-grid"></div>
  </section>

  <!-- GUI ekwipunku -->
  <div id="inventory-gui" class="inventory" style="display:none;">
    <div class="inventory-header">
      <button id="sell-all" class="sell-btn">Sprzedaj wszystko</button>
      <select id="sort-items" class="sort-select">
        <option value="newest">Od najnowszych</option>
        <option value="expensive">Od najdroższych</option>
      </select>
    </div>
    <div id="inventory-items" class="inventory-items"></div>
  </div>

  <!-- Sekcja skrzynki -->
  <section class="case-container">
    <h2 class="case-title">Tania Skrzynia</h2>
    <div class="case-box">
      <img src="https://i.imgur.com/4YFZtqE.png" alt="Tania Skrzynia" class="case-image">
      <p class="case-price">Cena: 20 zł</p>
    </div>

    <div class="open-options">
      <label>Otwórz:</label>
      <button class="open-btn" data-count="1">1x</button>
      <button class="open-btn" data-count="2">2x</button>
      <button class="open-btn" data-count="3">3x</button>
      <button id="fast-open" class="fast-btn">Fast Open ⚡</button>
    </div>

    <div id="case-result" class="case-result"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
