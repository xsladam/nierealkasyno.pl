<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Balance</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <div class="logo">FAKE<span>BALANCE</span></div>
            <button id="resetBtn" class="reset-btn">Resetuj konto</button>
        </header>

        <main>

            <div class="balance-card">
                <p>Twoje saldo</p>
                <h1 id="balance">250,00 zł</h1>

                <div class="balance-bottom">
                    <span>Wirtualne środki</span>
                    <span class="status">● DEMO</span>
                </div>
            </div>

            <div class="actions">

                <button id="add10">+10 zł</button>
                <button id="add50">+50 zł</button>
                <button id="add100">+100 zł</button>

            </div>

            <div class="custom-add">

                <input
                    type="number"
                    id="customAmount"
                    placeholder="Wpisz kwotę"
                    min="1"
                >

                <button id="addCustom">
                    Dodaj środki
                </button>

            </div>

            <section class="history">

                <div class="history-header">
                    <h2>Historia</h2>
                    <button id="clearHistory">Wyczyść</button>
                </div>

                <div id="transactions">
                    <div class="empty">
                        Brak transakcji
                    </div>
                </div>

            </section>

        </main>

        <footer>
            To jest wyłącznie symulator. Środki nie mają wartości pieniężnej.
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
